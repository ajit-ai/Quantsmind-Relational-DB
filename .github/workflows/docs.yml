name: docs

# Builds the Sphinx docs on every docs change and uploads the rendered HTML
# as a workflow artifact (downloadable from the Actions tab by collaborators).
# Private-repo friendly: nothing here touches GitHub Pages.
#
# Publishing to GitHub Pages is OPT-IN: run the workflow manually and set the
# `publish` input to true once the repo has Pages enabled (Settings -> Pages ->
# Source -> GitHub Actions). The site then goes live at /Quantsmind-Relational-DB/.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Deploy to GitHub Pages'
        type: boolean
        required: false
        default: false

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Sphinx docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build HTML
        run: sphinx-build -W -b html docs docs/_build/html

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only runs when explicitly requested via workflow_dispatch + publish=true.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4