[package]
name = "qmind-desktop"
description = "QuantsMind Desktop Studio (Tauri 2 shell)"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["QuantsMind contributors"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qmind-embed = { path = "../crates/qmind-embed" }
serde_json = "1"
tauri = { version = "2", features = [] }

[[bin]]
name = "qmind-desktop"
path = "src/main.rs"

