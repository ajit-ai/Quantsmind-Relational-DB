[package]
name = "qmind-desktop"
description = "QuantsMind Desktop Studio (Tauri 2 shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qmind-embed = { path = "../qmind-embed" }
serde_json = "1"
tauri = { version = "2", features = [] }

[[bin]]
name = "qmind-desktop"
path = "src/main.rs"

[lib]
name = "qmind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]