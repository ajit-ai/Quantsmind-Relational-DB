[package]
name = "qmind-desktop"
description = "QuantsMind Desktop Studio (Tauri 2 shell)"
version = "0.1.0"
edition = "2021"
rust-version = "0.1.0"
authors = ["QuantsMind contributors"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qmind-embed = { path = "../qmind-embed" }
serde_json = "1"
tauri = { version = "2", features = [] }

[[bin]]
name = "qmind-desktop"
path = "src/main.rs"

[lib]
name = "qmind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
