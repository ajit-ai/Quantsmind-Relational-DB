[package]
name = "qmind-sql"
description = "QuantsMind SQL layer: handwritten parser, Volcano executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
qmind-kernel = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["cargo_bench_support"] }

[[bin]]
name = "qmind-persistence-fixture"
path = "src/bin/qmind-persistence-fixture.rs"

[[bench]]
name = "sql_bench"
harness = false

